<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Parla</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --green:#58CC02; --green-d:#46A302;
  --blue:#1CB0F6;  --blue-d:#1789C8;
  --purple:#8549BA;
  --yellow:#FFD23C; --yellow-d:#E9A800;
  --coral:#FF5A7A;  --coral-d:#E5274C;
  --orange:#FF9600;
  --panda:#C95F2D; --panda-d:#76341F;
  --cream:#FFF1D6;
  --bg-deep:#F7F7F7;
  --surface:#FFFFFF;
  --border:#E5E5E5;
  --text:#3C3C3C;
  --text-muted:#777777;
  --ink:var(--text);
  --muted:var(--text-muted);
  --line:var(--border);
  --card:var(--surface);
  --bg:var(--bg-deep);
  --sel-bg:#DDF4FF; --sel-bd:var(--blue);
  --ok-bg:#D7FFB8; --ok-bd:var(--green);
  --no-bg:#FFE1E8; --no-bd:var(--coral);
  --transition:200ms ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--text);
  background:#FFFFFF;
  display:flex; align-items:center; justify-content:center; min-height:100dvh; overflow:hidden;
}
.font-display{font-family:'Nunito',system-ui,sans-serif;font-weight:800}
button{font-family:inherit; cursor:pointer; border:none; background:none; transition:transform 100ms ease, opacity var(--transition), background var(--transition), color var(--transition)}

.app{ width:100%; height:100dvh; display:flex; align-items:center; justify-content:center; }
.phone{
  position:relative; width:min(430px,100vw); height:min(880px,100dvh);
  background:var(--bg-deep); overflow:hidden; isolation:isolate;
  display:flex; flex-direction:column; color:var(--text);
}
@media(min-width:480px){
  .phone{ border-radius:40px; height:min(880px,94dvh);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.18),0 0 0 1px rgba(43,42,74,.06); }
}
.screen{ position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
.screen-fade{ animation:screenFade 150ms ease both; }
@keyframes screenFade{ from{opacity:0} to{opacity:1} }

/* Landing */
.landing{ padding:24px 24px calc(28px + env(safe-area-inset-bottom)); justify-content:space-between; overflow:hidden; background:#fff; }
.landing-glow{
  position:absolute; left:50%; top:28%; width:320px; height:320px; transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(61,220,132,.22) 0%,rgba(61,220,132,.06) 40%,transparent 70%);
  pointer-events:none;
}
.landing-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:12px; }
.landing-mascot{ margin-bottom:28px; }
.landing-headline{ font-size:clamp(28px,7vw,34px); font-weight:800; line-height:1.15; margin:0 0 12px; text-wrap:balance; letter-spacing:0; }
.landing-sub{ font-size:17px; font-weight:700; color:var(--text-muted); margin:0; line-height:1.4; }
.landing-actions{ display:flex; flex-direction:column; gap:14px; width:100%; }
.landing-enter-mascot{ animation:land-rise 0.4s ease-out both; }
.landing-enter-headline{ animation:land-rise 0.4s 0.2s ease-out both; }
.landing-enter-sub{ animation:land-rise 0.4s 0.3s ease-out both; }
.landing-enter-cta{ animation:land-rise 0.4s 0.4s ease-out both; }
@keyframes land-rise{ from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

.btn-pill{
  width:100%; padding:16px 24px; border-radius:9999px; font-size:17px; font-weight:800;
  color:#0E1117; transition:transform 100ms ease, filter var(--transition);
}
.btn-pill:active{ transform:scale(0.97); }
.btn-pill--green{ background:var(--green); box-shadow:0 5px 0 var(--green-d); }
.btn-pill--green:hover{ filter:brightness(1.05); }
.link-ghost{ font-size:15px; font-weight:700; color:var(--text-muted); padding:8px; }
.link-ghost:hover{ color:var(--text); }

/* Language select */
.language{ padding:0 20px calc(24px + env(safe-area-inset-bottom)); background:#fff; }
.lang-header{ position:relative; padding:18px 0 20px; text-align:center; }
.back-btn{
  position:absolute; left:0; top:14px; width:40px; height:40px; border-radius:12px;
  display:grid; place-items:center; color:var(--text-muted);
}
.back-btn svg path{ stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.back-btn:hover{ background:var(--surface); color:var(--text); }
.lang-title{ font-size:22px; font-weight:800; margin:0; line-height:1.25; padding:0 44px; }
.lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; overflow-y:auto; flex:1; align-content:start; padding-bottom:8px; }
.lang-card{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  min-height:120px; padding:18px 12px; background:var(--surface); border:2px solid var(--border); border-bottom-width:4px;
  border-radius:16px; transition:transform 100ms ease, border-color var(--transition), background var(--transition);
}
.lang-card:not(:disabled):active{ transform:scale(0.96); }
.lang-card:not(:disabled):hover{ border-color:var(--green); background:var(--surface); }
.lang-card--disabled{ opacity:.55; cursor:not-allowed; }
.lang-flag{ font-size:40px; line-height:1; }
.lang-name{ font-size:15px; font-weight:800; color:var(--text); }
.lang-badge{
  position:absolute; top:8px; right:8px; font-size:9px; font-weight:800; text-transform:uppercase;
  letter-spacing:.04em; color:var(--text-muted); background:rgba(139,148,158,.15);
  padding:4px 7px; border-radius:999px;
}

/* Home */
.home{ padding:20px 20px calc(22px + env(safe-area-inset-bottom)); overflow-y:auto; background:#fff; }
.home-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; }
.unit-kicker{ color:var(--purple); font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
.home-title{ margin:2px 0 0; font-size:25px; line-height:1.1; font-weight:900; letter-spacing:0; }
.home-tagline{ margin:8px 0 0; font-size:15px; font-weight:800; color:var(--text); line-height:1.35; max-width:280px; }
.home-meta{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:12px; }
.home-goal-pill{ display:inline-flex; padding:7px 14px; border-radius:999px; background:#F3FFE8; border:2px solid var(--green-d); color:var(--green-d); font-size:13px; font-weight:900; letter-spacing:.02em; }
.home-level-note{ margin:0; font-size:12px; font-weight:700; color:var(--text-muted); line-height:1.35; max-width:280px; }
.stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat-pill{ min-width:0; background:#fff; border:2px solid var(--border); border-bottom-width:4px; border-radius:14px; padding:9px 8px; display:grid; grid-template-columns:auto 1fr; column-gap:6px; align-items:center; }
.stat-icon{ grid-row:1 / span 2; font-size:18px; line-height:1; }
.stat-value{ font-weight:900; font-size:17px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-label{ color:var(--text-muted); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; }
.tone-fire .stat-value{ color:var(--orange); }
.tone-gem .stat-value{ color:var(--blue); }
.tone-heart .stat-value{ color:var(--coral); }
.mini-offer{ background:#F0F8FF; border:2px solid #BDEBFF; border-bottom-width:4px; border-radius:16px; padding:13px; display:grid; gap:10px; margin-bottom:18px; }
.mini-offer--urgent{ background:#FFF0F3; border-color:#FFC6D2; }
.mini-title{ font-size:16px; font-weight:900; color:var(--text); }
.mini-copy{ margin-top:2px; color:var(--text-muted); font-size:13px; font-weight:800; line-height:1.25; }
.mini-actions{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.mini-link,.mini-plus{ min-height:38px; border-radius:12px; border:2px solid var(--border); border-bottom-width:4px; background:#fff; color:var(--text); font-size:12px; font-weight:900; }
.mini-link:disabled{ opacity:.45; cursor:not-allowed; }
.mini-plus{ background:var(--purple); border-color:#6F3AA4; color:#fff; }
.mini-timer{ color:var(--text-muted); font-size:12px; font-weight:900; text-align:center; }
.path{ position:relative; display:grid; justify-items:center; gap:24px; padding:8px 0 20px; }
.path-line{ position:absolute; top:42px; bottom:68px; left:50%; width:8px; transform:translateX(-50%); background:#E5E5E5; border-radius:999px; }
.lesson-node{ position:relative; z-index:1; width:min(280px,92%); min-height:94px; background:#fff; border:2px solid var(--border); border-bottom-width:6px; border-radius:20px; display:grid; grid-template-columns:54px 1fr; grid-template-rows:auto auto; column-gap:12px; align-items:center; text-align:left; padding:14px 16px; color:var(--text); }
.lesson-node:active:not(:disabled){ transform:translateY(3px); border-bottom-width:3px; }
.lesson-node--active{ border-color:var(--green-d); background:#F3FFE9; }
.lesson-node--locked{ opacity:.62; cursor:not-allowed; }
.node-crown{ grid-row:1 / span 2; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:var(--green); color:#fff; font-size:24px; box-shadow:0 5px 0 var(--green-d); }
.lesson-node--locked .node-crown{ background:#CFCFCF; box-shadow:0 5px 0 #AFAFAF; }
.node-title{ font-size:18px; font-weight:900; line-height:1.1; }
.node-sub{ color:var(--text-muted); font-size:13px; font-weight:800; }

/* Quiz */
.topbar{ display:flex; align-items:center; gap:14px; padding:18px 20px 6px; }
.close-btn{ font-size:20px; color:var(--text-muted); font-weight:800; width:30px; height:30px; flex:none; border-radius:10px; transition:var(--transition); }
.close-btn:hover{ color:var(--text); background:var(--surface); }
.progress{ flex:1; height:16px; background:#E5E5E5; border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(var(--green),var(--green-d)); border-radius:999px; min-width:16px;
  transition:width .55s cubic-bezier(.34,1.3,.5,1); position:relative; }
.progress-shine{ position:absolute; left:6px; right:10px; top:3px; height:4px; border-radius:999px; background:rgba(255,255,255,.35); }
.hearts{ display:flex; gap:6px; align-items:center; flex:none; }
.heart{ display:block; transition:transform .2s; }
.heart--off path{ fill:#F0F0F0; stroke:#DADADA; }
.plus-heart{ min-width:50px; height:32px; border-radius:999px; display:grid; place-items:center; background:linear-gradient(120deg,#7C5CFF,#1CB0F6); color:#fff; font-size:26px; font-weight:900; line-height:1; }
.hearts--lost{ animation:heartsShake .4s ease; }
.hearts--lost .heart--break{ animation:heartBreak .5s ease forwards; }
@keyframes heartsShake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
@keyframes heartBreak{ 0%{transform:scale(1.25) rotate(-8deg)} 40%{transform:scale(.6) rotate(10deg); opacity:.4} 100%{transform:scale(0); opacity:0} }

.scene{ display:flex; align-items:flex-end; gap:10px; padding:6px 20px 2px; }
.bubble{ position:relative; background:var(--surface); border:2px solid var(--border); border-bottom-width:4px; border-radius:16px 16px 16px 4px;
  padding:10px 14px; font-weight:800; color:var(--text); font-size:15px;
  margin-bottom:18px; transition:var(--transition); }
.bubble::before{ content:''; position:absolute; left:-9px; bottom:8px; width:14px; height:14px; background:var(--surface);
  border-left:2px solid var(--border); border-bottom:2px solid var(--border); transform:rotate(45deg); border-radius:0 0 0 4px; }
.bubble--ok{ border-color:var(--ok-bd); color:var(--green); }
.bubble--ok::before{ border-color:var(--ok-bd) }
.bubble--no{ border-color:var(--no-bd); color:var(--coral); }
.bubble--no::before{ border-color:var(--no-bd) }

.quiz-scroll{ flex:1; min-height:0; overflow-y:auto; padding:6px 20px 16px;
  animation:qIn .42s cubic-bezier(.2,.9,.3,1) both; }
@keyframes qIn{ from{ transform:translateY(16px); opacity:0 } to{ transform:none; opacity:1 } }
.qcard{ padding:4px 2px; }
.qcard-label{ text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:900; color:var(--text-muted); margin-bottom:10px; }
.qcard-prompt{ font-size:30px; font-weight:800; line-height:1.12; margin:0 0 22px; text-wrap:balance; }
.qcard-quote{ color:var(--green); }
.opt-grid{ display:grid; grid-template-columns:repeat(var(--opt-cols,2),1fr); gap:12px; }
.opt{ display:flex; align-items:center; gap:10px; text-align:left; background:var(--surface); border:2px solid var(--border);
  border-bottom-width:4px; border-radius:16px; padding:16px 14px; min-height:66px; color:var(--text);
  font-weight:800; font-size:18px; transition:transform .08s, background var(--transition), border-color var(--transition); position:relative; }
.opt:not(:disabled):active{ transform:translateY(2px); border-bottom-width:2px; }
.opt-key{ flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--border); display:grid; place-items:center;
  font-size:13px; font-weight:800; color:var(--text-muted); }
.opt-label{ flex:1; }
.opt-mark{ flex:none; font-weight:900; font-size:16px; }
.opt-mark--ok{ color:var(--green) } .opt-mark--no{ color:var(--coral) }
.opt--sel{ background:var(--sel-bg); border-color:var(--sel-bd); }
.opt--sel .opt-key{ border-color:var(--sel-bd); color:var(--blue); }
.opt--correct{ background:var(--ok-bg); border-color:var(--ok-bd); }
.opt--correct .opt-key{ border-color:var(--ok-bd); color:var(--green); }
.opt--reveal{ background:var(--ok-bg); border-color:var(--ok-bd); }
.opt--wrong{ background:var(--no-bg); border-color:var(--no-bd); animation:nudge .35s; }
.opt--wrong .opt-key{ border-color:var(--no-bd); color:var(--coral); }
.opt--dim{ opacity:.45; }
@keyframes nudge{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.btn{ font-weight:800; font-size:18px; letter-spacing:.02em; color:#fff;
  border-radius:16px; padding:15px 20px; border-bottom:5px solid rgba(0,0,0,.25); transition:transform .08s, filter var(--transition); }
.btn--block{ width:100%; }
.btn--lg{ padding:17px 20px; font-size:19px; }
.btn:not(:disabled):active{ transform:translateY(3px); border-bottom-width:2px; filter:brightness(.97); }
.btn--green{ background:var(--green); border-bottom-color:var(--green-d); color:#fff; }
.btn--coral{ background:var(--coral); border-bottom-color:var(--coral-d); }
.btn--blue{ background:var(--blue); border-bottom-color:var(--blue-d); }
.btn--gold{ background:linear-gradient(100deg,#FFD23C,#FF9F3C); border-bottom-color:#E07A12; color:#5A3500; }
.btn--ghost{ background:#E5E5E5; border-bottom-color:#D0D0D0; color:#A0A0A0; cursor:not-allowed; }
.btn--ghost-action{ background:#fff; border:2px solid var(--border); border-bottom:5px solid #D7D7D7; color:var(--blue-d); }

.footer{ padding:14px 20px calc(18px + env(safe-area-inset-bottom)); }
.feedback{ position:absolute; left:0; right:0; bottom:0; transform:translateY(110%); transition:transform .34s cubic-bezier(.2,.9,.3,1);
  border-top-left-radius:22px; border-top-right-radius:22px; padding:18px 20px calc(20px + env(safe-area-inset-bottom)); z-index:5; }
.feedback--in{ transform:translateY(0); }
.feedback--ok{ background:var(--ok-bg); border-top:2px solid var(--ok-bd); }
.feedback--no{ background:var(--no-bg); border-top:2px solid var(--no-bd); }
.feedback-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.feedback-badge{ flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; font-weight:900; color:#fff; }
.fb-ok{ background:var(--green); color:#fff; } .fb-no{ background:var(--coral); }
.feedback-title{ font-size:22px; font-weight:800; }
.feedback--ok .feedback-title{ color:var(--green) } .feedback--no .feedback-title{ color:var(--coral) }
.feedback-sub{ font-weight:700; color:var(--text); font-size:15px; opacity:.85; }
.feedback-sub b{ font-weight:800; }

.screen--center{ align-items:center; justify-content:flex-start; text-align:center; padding:28px 24px calc(24px + env(safe-area-inset-bottom)); gap:4px; overflow-y:auto; background:#fff; }

.result-stars{ display:flex; gap:8px; margin-bottom:6px; }
.star-slot{ display:inline-flex; transform:scale(1); }
.star-slot.pop{ animation:starPop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes starPop{ 0%{transform:scale(.85)} 50%{transform:scale(1.16)} 100%{transform:scale(1)} }
.rstar--on{ filter:drop-shadow(0 6px 10px rgba(233,168,0,.4)); }
.rstar--off path{ fill:#30363D; stroke:#484F58; }
.result-mascot{ margin:4px 0 2px; }
.result-title{ font-size:30px; font-weight:800; margin:6px 0 2px; }
.result-sub{ color:var(--text-muted); font-weight:700; margin:0 0 18px; font-size:15px; }
.result-scorecard{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:360px; margin-bottom:18px; }
.score-pill{ flex:1; background:var(--surface); border:2px solid var(--border); border-bottom-width:4px; border-radius:16px; padding:14px 8px; }
.score-num{ display:block; font-size:25px; font-weight:800; color:var(--green); line-height:1; white-space:nowrap; }
.score-den{ font-size:18px; color:var(--text-muted); }
.score-cap{ display:block; margin-top:4px; text-transform:uppercase; letter-spacing:.1em; font-size:11px; font-weight:800; color:var(--text-muted); }
.result-actions{ width:100%; max-width:360px; display:grid; gap:10px; }
.result .btn{ max-width:360px; }

.locked-close{ position:absolute; left:18px; top:18px; }
.locked-mascot{ margin-top:12px; margin-bottom:4px; }
.locked-title{ font-size:27px; font-weight:800; margin:6px 0 4px; }
.locked-sub{ color:var(--text-muted); font-weight:700; font-size:15px; margin:0 0 18px; max-width:320px; }
.super-card{ position:relative; width:100%; max-width:360px; background:linear-gradient(160deg,#7C5CFF,#9B6BFF 55%,#C46BFF);
  border-radius:18px; padding:18px; color:#fff; text-align:left; overflow:hidden; box-shadow:0 18px 36px -14px rgba(124,92,255,.38); margin-bottom:14px; }
.super-glow{ position:absolute; inset:-40% 40% auto -10%; height:160px; background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%); }
.super-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.super-badge{ font-weight:800; letter-spacing:.06em; font-size:18px; background:rgba(255,255,255,.18); padding:5px 12px; border-radius:999px; }
.super-badge span{ color:var(--yellow); }
.super-tag{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; background:var(--yellow); color:#5A3500; padding:5px 10px; border-radius:999px; }
.super-title{ font-size:24px; font-weight:800; margin:2px 0 12px; }
.super-list{ list-style:none; margin:0 0 16px; padding:0; display:grid; gap:9px; }
.super-list li{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:10px; }
.tick{ flex:none; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; font-size:13px; font-weight:900; }
.super-fine{ text-align:center; font-size:12px; font-weight:700; opacity:.8; margin-top:9px; }
.recovery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:360px; margin-bottom:12px; }
.recovery-card{ min-height:70px; background:#fff; border:2px solid var(--border); border-bottom-width:4px; border-radius:16px; display:flex; align-items:center; gap:10px; padding:10px; text-align:left; color:var(--text); }
.recovery-card:disabled{ opacity:.45; cursor:not-allowed; }
.recovery-icon{ width:34px; height:34px; flex:none; border-radius:50%; display:grid; place-items:center; background:#F0F8FF; color:var(--blue); font-size:20px; font-weight:900; }
.recovery-card b{ display:block; font-size:14px; line-height:1.1; }
.recovery-card small{ display:block; margin-top:2px; color:var(--text-muted); font-size:11px; font-weight:800; line-height:1.15; }
.refill-row{ width:100%; max-width:360px; margin-bottom:8px; }
.refill-timer{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:2px solid var(--border);
  border-bottom-width:4px; border-radius:16px; padding:14px 18px; }
.refill-cap{ font-weight:800; color:var(--text-muted); font-size:14px; }
.refill-clock{ font-weight:800; font-size:20px; color:var(--text); font-variant-numeric:tabular-nums; }
.locked-reset{ font-weight:800; color:var(--text-muted); font-size:15px; text-decoration:underline; padding:6px; }
.locked-reset:hover{ color:var(--text); }
.heart-meter{ margin-top:8px; color:var(--text-muted); font-size:12px; font-weight:900; }

.confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2; }
.confetti-bit{ position:absolute; top:-12px; width:10px; height:14px; opacity:.95; animation:fall linear forwards; }
@keyframes fall{ 0%{ transform:translateY(-12px) rotate(0); opacity:1 } 100%{ transform:translateY(900px) rotate(540deg); opacity:.9 } }

.pip{ display:inline-block; line-height:0; }
.pip svg{ overflow:visible; }
.pip-body{ transform-box:fill-box; transform-origin:50% 100%; animation:pipBob 2.6s ease-in-out infinite; }
@keyframes pipBob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }
.pip-ears{ transform-box:fill-box; transform-origin:50% 100%; animation:pipSway 3.2s ease-in-out infinite; }
@keyframes pipSway{ 0%,100%{ transform:rotate(-4deg) } 50%{ transform:rotate(4deg) } }
.pip-arm-l{ transform-box:fill-box; transform-origin:80% 20%; animation:pipArmL 2.6s ease-in-out infinite; }
.pip-arm-r{ transform-box:fill-box; transform-origin:20% 20%; animation:pipArmR 2.6s ease-in-out infinite; }
@keyframes pipArmL{ 0%,100%{transform:rotate(8deg)} 50%{transform:rotate(-4deg)} }
@keyframes pipArmR{ 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(4deg)} }
.pip-eyes{ transform-box:fill-box; transform-origin:center; animation:pipBlink 4.2s infinite; }
@keyframes pipBlink{ 0%,92%,100%{ transform:scaleY(1) } 96%{ transform:scaleY(.1) } }
.pip--idle{ animation:pip-float 3s ease-in-out infinite; }
@keyframes pip-float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.pip--happy.pip-react{ animation:pip-bounce 0.5s cubic-bezier(.36,.07,.19,.97); }
@keyframes pip-bounce{ 0%,100%{transform:scale(1)} 30%{transform:scale(1.18)} 60%{transform:scale(.93)} }
.pip--sad.pip-react{ animation:pip-shake 0.45s cubic-bezier(.36,.07,.19,.97); }
@keyframes pip-shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} 80%{transform:translateX(-4px)} }
.pip--thinking{ animation:pip-pulse 1.8s ease-in-out infinite; }
.pip--listening .pip-pupil{ transition:transform .15s ease; }
.pip--gentleCorrection .pip-body{ animation:pipBob 2.6s ease-in-out infinite; }
.pip--worried .pip-body{ animation:pipBob 1.4s ease-in-out infinite; }
.pip--celebrating.pip-react{ animation:pip-bounce 0.5s cubic-bezier(.36,.07,.19,.97); }
@keyframes pip-pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
.pip--dizzy.pip-react{ animation:pipWobble .8s ease 1; }
@keyframes pipWobble{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
.pip-spark{ animation:sparkle 1s ease-out forwards; transform-box:fill-box; transform-origin:center; }
@keyframes sparkle{ 0%{transform:scale(.4); opacity:0} 30%{opacity:1} 100%{transform:scale(1.15) translateY(-8px); opacity:0} }
.pip-tear{ animation:teardrop 1.2s ease-in forwards; }
@keyframes teardrop{ 0%{transform:translateY(0); opacity:0} 20%{opacity:1} 100%{transform:translateY(40px); opacity:0} }
.pip-swirl{ transform-box:fill-box; transform-origin:center; animation:swirl 1s linear; }
@keyframes swirl{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

.ob{ position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
.ob-nav{ display:flex; align-items:center; padding:12px 16px 0; min-height:52px; }
.ob-nav--spacer{ visibility:hidden; pointer-events:none; }
.ob-nav .back-btn{ position:static; width:auto; height:auto; display:inline-flex; align-items:center; gap:6px; padding:8px 10px 8px 6px; border-radius:12px; font-size:15px; font-weight:800; color:var(--text-muted); }
.back-btn--labeled .back-label{ line-height:1; }
.ob-dots{ display:flex; gap:7px; justify-content:center; padding:8px 0 0; }
.ob-dot{ width:9px; height:9px; border-radius:50%; background:#E2DDD0; transition:.2s; }
.ob-dot--on{ background:var(--green); transform:scale(1.25); }
.ob-dot--done{ background:var(--green-d); }
.ob-welcome{ flex:1; }
.ob-title{ font-size:28px; font-weight:700; margin:14px 0 6px; text-wrap:balance; }
.ob-sub{ color:var(--muted); font-weight:700; font-size:15px; margin:0 0 10px; max-width:300px; }
.ob-cta{ width:100%; max-width:340px; margin-top:14px; }
.ob-step{ flex:1; }
.ob-head{ padding:10px 24px 4px; text-align:center; }
.ob-head .ob-sub{ margin:0 auto; }
.ob-scroll{ flex:1; min-height:0; overflow-y:auto; padding:14px 20px 10px; }
.lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.lang-card{ display:flex; flex-direction:column; align-items:center; gap:7px; background:#fff; border:2px solid var(--line);
  border-bottom-width:4px; border-radius:18px; padding:18px 10px 14px; transition:transform .08s, background .15s, border-color .15s; }
.lang-card:not(:disabled):active{ transform:translateY(2px); border-bottom-width:2px; }
.lang-card--sel{ background:var(--sel-bg); border-color:var(--sel-bd); }
.lang-card--soon{ opacity:.55; cursor:not-allowed; }
.lang-flag{ border-radius:5px; }
.lang-name{ font-weight:800; font-size:17px; color:var(--ink); }
.lang-meta{ font-weight:800; font-size:12px; color:var(--muted); }
.lang-card--soon .lang-meta{ text-transform:uppercase; letter-spacing:.06em; color:var(--blue-d); }
.goal-list{ display:grid; gap:12px; max-width:360px; margin:0 auto; }
.goal-row{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:2px solid var(--line);
  border-bottom-width:4px; border-radius:16px; padding:17px 18px; transition:transform .08s, background .15s, border-color .15s; }
.goal-row:active{ transform:translateY(2px); border-bottom-width:2px; }
.goal-row--sel{ background:var(--sel-bg); border-color:var(--sel-bd); }
.goal-label{ font-weight:800; font-size:17px; color:var(--ink); }
.goal-detail{ font-weight:800; font-size:14px; color:var(--muted); }
.goal-row--sel .goal-detail{ color:var(--blue-d); }
.row-emoji{ flex:none; font-size:24px; line-height:1; margin-right:12px; }
.row-text{ flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
.row-detail{ font-weight:800; font-size:13px; color:var(--muted); }
.goal-row--sel .row-detail{ color:var(--blue-d); }

.ob-pip-ack{ margin:10px auto 0; max-width:320px; font-size:14px; font-weight:700; color:var(--blue-d); line-height:1.4;
  text-align:center; animation:ack-in .2s ease-out; }
@keyframes ack-in{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
.lang-card--sel, .goal-row--sel{ box-shadow:0 0 0 2px rgba(88,204,2,.18); }
.ob-summary{ text-align:center; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
.ob-summary-body{ flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 24px 12px; overflow-y:auto; }
.ob-pip-bubble{ margin:12px 0 16px; padding:12px 16px; max-width:300px; background:#F3FFE8; border:2px solid rgba(88,204,2,.25);
  border-radius:16px; font-size:15px; font-weight:800; color:var(--ink); line-height:1.35; }
.plan-summary-list{ list-style:none; margin:18px 0 24px; padding:0; width:100%; max-width:280px; border-top:2px solid var(--line); }
.plan-summary-row{ padding:14px 4px; border-bottom:2px solid var(--line); font-size:17px; font-weight:800; color:var(--ink); }

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important; animation-iteration-count:1!important;}
}
</style>
</head>

<div id="root"></div>

<script type="module" src="/main.jsx"></script>
</body>
